# Azure Pipelines: runs the pytest + Playwright suite on every push and pull request to main.
# It runs on the self-hosted agent (this Mac) in the Default pool, so it uses the Mac's own
# PHP, Flutter and Python instead of installing them. Device (Appium) tests are skipped: they only
# run with --run-device.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default

steps:
  # The agent runs as a service without your shell profile, so add PHP (php.new) and Flutter to PATH.
  - script: |
      echo "##vso[task.prependpath]$HOME/.config/herd-lite/bin"
      echo "##vso[task.prependpath]$HOME/development/flutter/bin"
    displayName: Add PHP and Flutter to PATH

  - script: |
      php --version
      flutter --version
      python3 --version
    displayName: Show PHP, Flutter and Python versions

  - script: flutter analyze && flutter test
    workingDirectory: app
    displayName: Check and unit-test the Flutter app

  - script: python3 -m venv .venv
    displayName: Create Python virtual environment

  - script: .venv/bin/pip install -r requirements-dev.txt
    displayName: Install test libraries

  # Lint before running anything: a lint error fails the run fast. --output-format azure turns each
  # problem into an error annotation on the run's summary page. Rules are in ruff.toml.
  - script: .venv/bin/ruff check --output-format azure tests
    displayName: Lint the tests (Ruff)

  - script: .venv/bin/playwright install chromium
    displayName: Install Chromium

  - script: .venv/bin/pytest --junitxml=junit/test-results.xml
    displayName: Run tests

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: junit/test-results.xml
      testRunTitle: FAR Notes tests

  - task: PublishPipelineArtifact@1
    displayName: Save traces, screenshots and videos of failed tests
    condition: failed()
    inputs:
      targetPath: test-results
      # Artifact names must be unique within a run, so a rerun of failed jobs gets its own name.
      artifact: playwright-failures-attempt-$(System.JobAttempt)
