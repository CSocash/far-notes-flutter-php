# Ruff (Python linter) settings for the test suite. Run with `.venv/bin/ruff check tests`.
# A Claude Code hook in .claude/settings.json also runs it on every Python file Claude edits.

line-length = 120   # the same width as the rest of the project

[lint]
# Only the core checks that catch real bugs: syntax errors, undefined names, unused imports and
# variables, and a few statement-level mistakes. Style rules (import order, etc.) are left out.
select = ["E4", "E7", "E9", "F"]
